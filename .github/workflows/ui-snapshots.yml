name: ui-snapshots

on:
  push:
    branches:
      - "mvp/**"
    paths:
      - "mobile/**"
      - ".github/workflows/ui-snapshots.yml"
  workflow_dispatch:

jobs:
  snapshots:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mezzo_passo
          POSTGRES_USER: mezzo
          POSTGRES_PASSWORD: mezzo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mezzo -d mezzo_passo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mezzo:mezzo@localhost:5432/mezzo_passo?sslmode=disable
      PORT: "8080"
      EXPO_PUBLIC_API_URL: http://127.0.0.1:8080
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Start API
        working-directory: backend
        run: |
          nohup go run ./cmd/api > /tmp/mezzo-passo-api.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mezzo-passo-api.log
          exit 1
      - name: Install app dependencies
        run: npm install
      - name: Install web and Playwright dependencies
        run: |
          npx expo install react-dom react-native-web @expo/metro-runtime
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start Expo web
        run: |
          nohup npx expo start --web --port 19006 > /tmp/expo.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:19006 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/expo.log
          exit 1
      - name: Capture UI snapshots
        run: |
          node e2e/ui-snapshots.mjs || {
            echo "===== EXPO LOG ====="
            cat /tmp/expo.log
            echo "===== API LOG ====="
            cat /tmp/mezzo-passo-api.log
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mezzo-passo-ui-snapshots
          path: mobile/artifacts/ui
          retention-days: 3
