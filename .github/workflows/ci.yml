name: ci

on:
  push:
    branches:
      - main
      - "mvp/**"
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mezzo_passo
          POSTGRES_USER: mezzo
          POSTGRES_PASSWORD: mezzo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mezzo -d mezzo_passo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://mezzo:mezzo@localhost:5432/mezzo_passo?sslmode=disable
      PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Resolve modules
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Smoke test API and paranza onboarding
        run: |
          go run ./cmd/api >/tmp/mezzo-passo-api.log 2>&1 &
          PID=$!
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              LOGIN=$(curl --fail --silent \
                -X POST http://127.0.0.1:8080/api/v1/demo/login \
                -H 'Content-Type: application/json' \
                -d '{"role":"capoparanza"}')
              TOKEN=$(printf '%s' "$LOGIN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')

              SAVED=$(curl --fail --silent \
                -X PUT http://127.0.0.1:8080/api/v1/onboarding/paranza \
                -H "Authorization: Bearer $TOKEN" \
                -H 'Content-Type: application/json' \
                -d '{"name":"Orgoglio Nolano Test","description":"Onboarding smoke test","managerName":"Luca Iorio","primaryColor":"#FFFFFF","secondaryColor":"#0A4DBA"}')

              printf '%s' "$SAVED" | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p["name"]=="Orgoglio Nolano Test"; assert p["description"]=="Onboarding smoke test"; assert p["managerName"]=="Luca Iorio"'

              ME=$(curl --fail --silent \
                http://127.0.0.1:8080/api/v1/me \
                -H "Authorization: Bearer $TOKEN")
              printf '%s' "$ME" | python3 -c 'import json,sys; me=json.load(sys.stdin); assert me["paranza"]["name"]=="Orgoglio Nolano Test"'

              kill $PID
              wait $PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mezzo-passo-api.log
          kill $PID || true
          exit 1

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
